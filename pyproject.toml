[project]
name = "norsk-asr"
version = "0.1.0"
description = "Norwegian CTC speech recognition on the EmbeddingGemma 2 audio encoder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=3",
    "huggingface-hub>=2.2.0",
    "imageio-ffmpeg>=0.6.0",
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "num2words>=0.5.14",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "soundfile>=0.14.0",
    "torch>=2.5",
    "transformers>=5.19",
]

[project.optional-dependencies]
# Beam search with a KenLM language model. kenlm builds from source (needs a C++ compiler).
lm = ["kenlm", "pyctcdecode>=0.5.0"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# pyctcdecode pins numpy<2 but works with numpy 2; librosa needs numpy>=2.
override-dependencies = ["numpy>=2.1"]

[tool.uv.sources]
kenlm = { url = "https://github.com/kpu/kenlm/archive/master.zip" }
